services:
  # ---------------------------------------------------------------------------
  # 1. LandSetu FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: landsetu-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"

  # ---------------------------------------------------------------------------
  # 2. LandSetu React / Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: landsetu-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: landsetu-backend
          property: url
          suffix: "/api"
