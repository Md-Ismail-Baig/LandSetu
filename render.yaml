services:
  # ---------------------------------------------------------------------------
  # 1. LandSetu FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: landsetu-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    disk:
      name: landsetu-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        fromService:
          type: static
          name: landsetu-frontend
          property: url
      - key: DATABASE_PATH
        value: /var/data/landsetu.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"

  # ---------------------------------------------------------------------------
  # 2. LandSetu React / Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: landsetu-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: landsetu-backend
          property: url
          suffix: "/api"
